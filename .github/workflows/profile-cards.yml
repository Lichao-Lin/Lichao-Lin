name: Update profile cards

on:
  push:
    branches: [main]
    paths:
      - scripts/generate-profile-cards.mjs
      - .github/workflows/profile-cards.yml
  schedule:
    - cron: '23 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the card renderer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lichao-Lin/github-readme-stats
          ref: 5df91f9bfa89c356a55cbb3c2bbc164fdbf94a86
          path: .stats-generator
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install renderer dependencies
        working-directory: .stats-generator
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Generate public profile cards
        run: node scripts/generate-profile-cards.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_ENV: production
      - name: Commit refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cards/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh public profile cards'
          git pull --rebase origin main
          git push origin HEAD:main
