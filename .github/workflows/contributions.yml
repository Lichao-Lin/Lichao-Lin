name: Update contribution visualizations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/contributions.yml
      - .github/profile-3d/blue.json
      - scripts/generate-contribution-graph.mjs
      - scripts/layout-contributions.py
  schedule:
    - cron: '43 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate blue 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d/blue.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Arrange 3D profile panels
        run: python scripts/layout-contributions.py
      - name: Generate daily contribution line graphs
        run: node scripts/generate-contribution-graph.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit generated visualizations
        run: |
          test -s profile-3d-contrib/profile-blue.svg
          test -s profile-3d-contrib/profile-blue-dark.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib/*.svg assets/activity/*.svg assets/activity/contributions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh contribution calendar and daily activity graphs'
          git pull --rebase origin main
          git push origin HEAD:main
